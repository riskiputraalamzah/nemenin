<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk — Nemenin</title>
    <meta name="description" content="Masuk ke akun Nemenin kamu." />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { jakarta: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        teal: { DEFAULT: '#E07A5F', light: '#F2A68B', dark: '#C1574A' },
                        peach: { DEFAULT: '#F2CC8F', light: '#F7DBA7', dark: '#D4A55A' },
                        navy: { DEFAULT: '#0F172A', light: '#1E293B', card: '#1E293B', border: '#334155' },
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/lenis@1/dist/lenis.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body
    class="font-jakarta bg-[#0F172A] text-slate-100 min-h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Background Blobs -->
    <div class="hero-blob w-96 h-96 bg-teal/20 -top-32 -right-32 absolute"></div>
    <div class="hero-blob w-72 h-72 bg-peach/15 bottom-10 left-10 absolute" style="animation-delay: -4s;"></div>
    <div class="absolute inset-0 bg-gradient-to-br from-peach/5 via-transparent to-teal/5 pointer-events-none"></div>

    <div class="w-full max-w-md mx-auto px-4 py-12 relative z-10">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-2 text-2xl font-bold text-white no-underline">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-teal to-peach flex items-center justify-center">
                    <i data-lucide="heart-handshake" class="w-6 h-6 text-white"></i>
                </div>
                <span>Nemenin</span>
            </a>
            <p class="text-slate-400 text-sm mt-2">Selamat datang kembali 👋</p>
        </div>

        <!-- Login Card -->
        <div class="glass-card p-8">
            <form onsubmit="handleLogin(event)">
                <!-- Email -->
                <div class="mb-4">
                    <label class="form-label">Email</label>
                    <div class="relative">
                        <i data-lucide="mail"
                            class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                        <input type="email" placeholder="nama@email.com" class="form-input pl-10" required />
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="relative">
                        <i data-lucide="lock"
                            class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                        <input type="password" id="login-pass" placeholder="Masukkan password" class="form-input pl-10"
                            required />
                        <button type="button" onclick="togglePass()"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors">
                            <i data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember & Forgot -->
                <div class="flex items-center justify-between mb-6">
                    <label class="flex items-center gap-2 text-sm text-slate-400 cursor-pointer">
                        <input type="checkbox" class="accent-teal w-4 h-4" />
                        Ingat saya
                    </label>
                    <a href="#" class="text-sm text-teal-light hover:underline">Lupa password?</a>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-primary w-full justify-center">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    Masuk
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center gap-4 my-6">
                <div class="flex-1 h-px bg-navy-border"></div>
                <span class="text-xs text-slate-500">atau masuk dengan</span>
                <div class="flex-1 h-px bg-navy-border"></div>
            </div>

            <!-- Social Login -->
            <div class="flex gap-3">
                <button
                    class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl bg-navy border border-navy-border text-slate-300 text-sm font-medium hover:border-slate-500 transition-all">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                            fill="#4285F4" />
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853" />
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                            fill="#FBBC05" />
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335" />
                    </svg>
                    Google
                </button>
                <button
                    class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl bg-navy border border-navy-border text-slate-300 text-sm font-medium hover:border-slate-500 transition-all">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                    </svg>
                    Facebook
                </button>
            </div>

            <!-- Register Link -->
            <p class="text-center text-sm text-slate-400 mt-6">
                Belum punya akun? <a href="register.html" class="text-teal-light font-semibold hover:underline">Daftar
                    sekarang</a>
            </p>
        </div>

        <p class="text-center text-xs text-slate-500 mt-6">
            &copy; 2026 Nemenin. Semua hak dilindungi.
        </p>
    </div>

    <script>
        lucide.createIcons();

        function togglePass() {
            const input = document.getElementById('login-pass');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function handleLogin(e) {
            e.preventDefault();
            const toast = document.createElement('div');
            toast.innerHTML = '✅ Berhasil masuk! Mengarahkan...';
            toast.style.cssText = `position:fixed;bottom:2rem;right:2rem;background:linear-gradient(135deg,#E07A5F,#F2A68B);color:#fff;padding:1rem 1.5rem;border-radius:0.75rem;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,0.3);animation:fadeInUp 0.4s ease;`;
            document.body.appendChild(toast);
            setTimeout(() => window.location.href = 'dashboard.html', 1500);
        }
    </script>
</body>

</html>
